<!DOCTYPE html>
<!--
  STREEEM RUNNER — Three.js Lane Runner Mini-Game
  Based on Super Hopper by holasoymalva — MIT License (codepen.io/holasoymalva/pen/XJKdqVj)
  Reskinned for Streeem — dark glass aesthetic, geometric cube player, crystal decorations
  This game runs entirely within a sandboxed iframe.
  Score is sent to parent via postMessage on game over.
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>Streeem Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #4f9fff;
      --secondary-color: #a78bfa;
      --text-color: #ffffff;
      --pixel-font: 'VT323', monospace;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      overflow: hidden;
      background-color: #0a0a14;
      font-family: var(--pixel-font);
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    button {
      pointer-events: auto;
    }

    .center-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      padding: 2rem 4rem;
      border-radius: 20px;
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.50),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }

    .title {
      font-size: 6rem;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(79, 159, 255, 0.8), 4px 4px rgba(79, 159, 255, 0.4);
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    .subtitle {
      font-size: 2.5rem;
      color: rgba(255, 255, 255, 0.50);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    button {
      background: rgba(255, 255, 255, 0.10);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.20);
      padding: 1rem 2.5rem;
      font-size: 2rem;
      font-family: var(--pixel-font);
      cursor: pointer;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.1s, background 0.15s, box-shadow 0.1s;
      box-shadow: 0 4px 20px rgba(79, 159, 255, 0.25);
      letter-spacing: 0.05em;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    button:hover {
      background: rgba(79, 159, 255, 0.20);
      border-color: rgba(79, 159, 255, 0.50);
      box-shadow: 0 4px 24px rgba(79, 159, 255, 0.40);
    }

    #instructions {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.06);
      padding: 1rem;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.70);
      font-size: 1.5rem;
      text-align: right;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      pointer-events: none;
    }

    .key {
      display: inline-block;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      padding: 0 6px;
      margin: 0 2px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.3);
    }

    #score-display {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2.5rem;
      color: rgba(255, 255, 255, 0.90);
      text-shadow: 0 0 12px rgba(79, 159, 255, 0.60);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    #game-over-screen .subtitle {
      color: var(--primary-color);
      text-shadow: 0 0 16px rgba(79, 159, 255, 0.6);
    }

    .hidden {
      display: none !important;
    }

    /* ── Touch Controls ── */
    #touch-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 70px;
      height: 70px;
      font-size: 2rem;
      padding: 0;
      border-radius: 50% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.80;
    }

    .touch-jump {
      background: rgba(79, 159, 255, 0.20) !important;
      border-color: rgba(79, 159, 255, 0.40) !important;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 3.5rem;
      }

      .subtitle {
        font-size: 1.5rem;
      }

      .center-screen {
        padding: 1.5rem 2rem;
      }
    }
  </style>
</head>

<body>

  <div id="game-container"></div>

  <div id="ui-layer">
    <div id="score-display" class="hidden">SCORE: <span id="score">0</span></div>

    <div id="instructions">
      CONTROLS:<br />
      <span class="key">←</span> <span class="key">→</span> MOVE<br />
      <span class="key">↑</span> JUMP
    </div>

    <div id="start-screen" class="center-screen">
      <h1 class="title">STREEEM<br />RUNNER</h1>
      <p class="subtitle">PLAY BETWEEN CALLS</p>
      <button id="start-btn">START</button>
    </div>

    <div id="game-over-screen" class="center-screen hidden">
      <h1 class="title" style="font-size:4rem;">GAME OVER</h1>
      <p class="subtitle">SCORE: <span id="final-score">0</span></p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <!-- Touch Controls (shown on touch devices only) -->
    <div id="touch-controls" class="hidden">
      <button id="btn-left" class="touch-btn">&#8592;</button>
      <button id="btn-jump" class="touch-btn touch-jump">&#8593;</button>
      <button id="btn-right" class="touch-btn">&#8594;</button>
    </div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
  <script type="module">
    import * as THREE from "three";

    // ─── CONFIG ──────────────────────────────────────────────────
    const CONFIG = {
      laneWidth: 2.5,
      cameraOffset: { x: 0, y: 7, z: 10 },
      gravity: 0.015,
      jumpPower: 0.35,
      baseSpeed: 0.15,
      speedInc: 0.00005,
      floorLength: 400,
      fogDensity: 0.02,
    };

    // ─── STATE ───────────────────────────────────────────────────
    let state = {
      isPlaying: false,
      score: 0,
      speed: CONFIG.baseSpeed,
      lane: 0,
      currentLaneX: 0,
      isJumping: false,
      jumpVel: 0,
      playerY: 0,
      theme: null,
    };

    // ─── DOM REFS ────────────────────────────────────────────────
    const elScore = document.getElementById("score");
    const elScoreFinal = document.getElementById("final-score");
    const uiScore = document.getElementById("score-display");
    const uiStart = document.getElementById("start-screen");
    const uiGameOver = document.getElementById("game-over-screen");
    const uiInstructions = document.getElementById("instructions");
    const touchControls = document.getElementById("touch-controls");

    // ─── THREE.JS GLOBALS ───────────────────────────────────────
    let scene, camera, renderer, player;
    let floorGroups = [];
    let worldObjects = [];
    let spawnTimer = 0;
    let lastTime = 0;

    // ─── SINGLE STREEEM THEME ───────────────────────────────────
    const STREEEM_THEME = {
      name: "Streeem",
      sky: 0x0a0a14,
      ground: 0x0d0d1a,
      obstacle: 0xff3333,
      decor: 0x4f9fff,
      player: 0x4f9fff,
    };

    function randomTheme() {
      return STREEEM_THEME;
    }

    // ─── INIT ────────────────────────────────────────────────────
    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        60, window.innerWidth / window.innerHeight, 0.1, 100
      );
      camera.position.set(
        CONFIG.cameraOffset.x,
        CONFIG.cameraOffset.y,
        CONFIG.cameraOffset.z
      );
      camera.lookAt(0, 0, -5);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById("game-container").appendChild(renderer.domElement);

      // Cool blue-tinted lights
      const ambientLight = new THREE.AmbientLight(0x8899cc, 0.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xaabbff, 0.9);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      renderer.render(scene, camera);

      window.addEventListener("resize", onWindowResize, false);
      document.addEventListener("keydown", handleInput);

      document.getElementById("start-btn").addEventListener("click", startGame);
      document.getElementById("restart-btn").addEventListener("click", startGame);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ─── CREATE PLAYER — Glowing Geometric Cube ─────────────────
    function createPlayer() {
      if (player) scene.remove(player);

      const group = new THREE.Group();

      // Main body — glowing blue cube
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x4f9fff,
        emissive: 0x1a3fff,
        emissiveIntensity: 0.4,
        flatShading: true,
        metalness: 0.5,
        roughness: 0.3,
      });
      const bodyGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      group.add(body);

      // White accent top
      const accentMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 0.3,
        flatShading: true,
      });
      const accentGeo = new THREE.BoxGeometry(0.5, 0.1, 0.5);
      const accent = new THREE.Mesh(accentGeo, accentMat);
      accent.position.y = 0.95;
      group.add(accent);

      // Blue glow aura
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0x4f9fff,
        transparent: true,
        opacity: 0.12,
      });
      const glowGeo = new THREE.SphereGeometry(0.7, 16, 16);
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.position.y = 0.5;
      group.add(glow);

      // Blue point light under character
      const charLight = new THREE.PointLight(0x4f9fff, 0.6, 4);
      charLight.position.set(0, 0.2, 0);
      group.add(charLight);

      scene.add(group);
      return group;
    }

    // ─── CREATE OBSTACLE — Glowing Hazard ───────────────────────
    function createObstacleMesh() {
      const group = new THREE.Group();
      const shapes = ["octahedron", "box", "cone"];
      const shape = shapes[Math.floor(Math.random() * shapes.length)];

      const obsMat = new THREE.MeshStandardMaterial({
        color: 0xff3333,
        emissive: 0x660000,
        emissiveIntensity: 0.5,
        flatShading: true,
        metalness: 0.3,
        roughness: 0.4,
      });

      let geo;
      switch (shape) {
        case "octahedron":
          geo = new THREE.OctahedronGeometry(0.5 + Math.random() * 0.3);
          break;
        case "box":
          geo = new THREE.BoxGeometry(
            0.6 + Math.random() * 0.4,
            0.8 + Math.random() * 0.6,
            0.6 + Math.random() * 0.4
          );
          break;
        case "cone":
          geo = new THREE.ConeGeometry(0.4 + Math.random() * 0.3, 1.0 + Math.random() * 0.5, 5);
          break;
      }

      const mesh = new THREE.Mesh(geo, obsMat);
      mesh.position.y = 0.5;
      mesh.rotation.y = Math.random() * Math.PI;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      // Red point light
      const obsLight = new THREE.PointLight(0xff3333, 0.5, 4);
      obsLight.position.set(0, 0.8, 0);
      group.add(obsLight);

      return group;
    }

    // ─── CREATE DECORATION — Crystal Formation ──────────────────
    function createDecorationMesh() {
      const group = new THREE.Group();

      const crystalMat = new THREE.MeshStandardMaterial({
        color: 0x4f9fff,
        emissive: 0x1a5fff,
        emissiveIntensity: 0.5,
        flatShading: true,
        transparent: true,
        opacity: 0.85,
        metalness: 0.5,
        roughness: 0.2,
      });

      const h = 0.8 + Math.random() * 1.2;
      const crystalGeo = new THREE.OctahedronGeometry(0.3 + Math.random() * 0.3);
      const crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.y = h;
      crystal.rotation.y = Math.random() * Math.PI;
      crystal.castShadow = true;
      group.add(crystal);

      // Thin stem
      const stemMat = new THREE.MeshStandardMaterial({
        color: 0x334466,
        flatShading: true,
      });
      const stemGeo = new THREE.CylinderGeometry(0.04, 0.06, h, 4);
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = h / 2;
      group.add(stem);

      // Subtle blue point light
      const crystalLight = new THREE.PointLight(0x4f9fff, 0.4, 3);
      crystalLight.position.set(0, h, 0);
      group.add(crystalLight);

      return group;
    }

    // ─── SPAWN ROW ──────────────────────────────────────────────
    function spawnRow() {
      const zStart = -60;

      // Left Decor
      if (Math.random() > 0.3) {
        const dL = createDecorationMesh();
        dL.position.set(-5 - Math.random() * 5, 0, zStart);
        scene.add(dL);
        worldObjects.push({ mesh: dL, type: "decor" });
      }

      // Right Decor
      if (Math.random() > 0.3) {
        const dR = createDecorationMesh();
        dR.position.set(5 + Math.random() * 5, 0, zStart);
        scene.add(dR);
        worldObjects.push({ mesh: dR, type: "decor" });
      }

      // Obstacle Logic — 70% chance of obstacle
      if (Math.random() > 0.3) {
        const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
        const obs = createObstacleMesh();
        obs.position.set(lane * CONFIG.laneWidth, 0, zStart);
        scene.add(obs);
        worldObjects.push({ mesh: obs, type: "obstacle", lane: lane, passed: false });
      }
    }

    // ─── START GAME ─────────────────────────────────────────────
    function startGame() {
      if (state.isPlaying) return;

      state = {
        isPlaying: true,
        score: 0,
        speed: CONFIG.baseSpeed,
        lane: 0,
        currentLaneX: 0,
        isJumping: false,
        jumpVel: 0,
        playerY: 0,
        theme: randomTheme(),
      };

      // UI
      uiStart.classList.add("hidden");
      uiGameOver.classList.add("hidden");
      uiScore.classList.remove("hidden");
      elScore.innerText = "0";

      // Environment Setup
      scene.background = new THREE.Color(state.theme.sky);
      scene.fog = new THREE.Fog(state.theme.sky, 10, 50);

      // Floor — remove old
      floorGroups.forEach((f) => scene.remove(f));
      floorGroups = [];

      // Dark floor plane
      const planeGeo = new THREE.PlaneGeometry(100, 200);
      const planeMat = new THREE.MeshStandardMaterial({
        color: 0x0d0d1a,
        roughness: 0.9,
        metalness: 0.1,
        flatShading: true,
      });
      const floor = new THREE.Mesh(planeGeo, planeMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.z = -50;
      floor.receiveShadow = true;
      scene.add(floor);
      floorGroups.push(floor);

      // Blue grid for speed sensation
      const grid = new THREE.GridHelper(200, 100, 0x4f9fff, 0x1a2a4a);
      grid.position.y = 0.01;
      grid.position.z = -50;
      grid.material.opacity = 0.25;
      grid.material.transparent = true;
      scene.add(grid);
      floorGroups.push(grid);

      // Player
      player = createPlayer();
      player.position.set(0, 0, 0);

      // Clear old objects
      worldObjects.forEach((obj) => scene.remove(obj.mesh));
      worldObjects = [];
      spawnTimer = 0;

      // Show touch controls if touch device
      if ("ontouchstart" in window) {
        touchControls.style.visibility = "visible";
      }

      lastTime = Date.now();
      animate();
    }

    // ─── GAME OVER ──────────────────────────────────────────────
    function gameOver() {
      state.isPlaying = false;
      uiGameOver.classList.remove("hidden");
      uiScore.classList.add("hidden");
      elScoreFinal.innerText = Math.floor(state.score);

      if ("ontouchstart" in window) {
        touchControls.style.visibility = "hidden";
      }

      // Send score to parent (Streeem iframe integration)
      try {
        window.parent.postMessage({ type: "GAME_SCORE", score: Math.floor(state.score) }, "*");
      } catch (e) { /* sandboxed — ignore */ }
    }

    // ─── INPUT ──────────────────────────────────────────────────
    function handleInput(e) {
      if (!state.isPlaying) {
        if (e.code === "Space" || e.code === "Enter") startGame();
        return;
      }

      switch (e.code) {
        case "ArrowLeft":
          if (state.lane > -1) state.lane--;
          break;
        case "ArrowRight":
          if (state.lane < 1) state.lane++;
          break;
        case "ArrowUp":
        case "Space":
          if (!state.isJumping) {
            state.isJumping = true;
            state.jumpVel = CONFIG.jumpPower;
          }
          break;
      }
    }

    // ─── ANIMATE ────────────────────────────────────────────────
    function animate() {
      if (!state.isPlaying) return;
      requestAnimationFrame(animate);

      // Score & speed
      state.score += state.speed;
      state.speed += CONFIG.speedInc;
      elScore.innerText = Math.floor(state.score);

      // Player lane lerp
      const targetX = state.lane * CONFIG.laneWidth;
      state.currentLaneX += (targetX - state.currentLaneX) * 0.15;
      player.position.x = state.currentLaneX;

      // Jump physics
      if (state.isJumping) {
        state.playerY += state.jumpVel;
        state.jumpVel -= CONFIG.gravity;
        if (state.playerY <= 0) {
          state.playerY = 0;
          state.isJumping = false;
        }
      } else {
        // Run bounce
        state.playerY = Math.abs(Math.sin(Date.now() * 0.015)) * 0.1;
      }
      player.position.y = state.playerY + 0.5;

      // Tilt into turn
      player.rotation.z = (state.currentLaneX - player.position.x) * -0.1;
      player.rotation.x = state.isJumping ? -0.2 : 0;

      // Spawn world
      spawnTimer += state.speed;
      if (spawnTimer > 3) {
        spawnRow();
        spawnTimer = 0;
      }

      // Move world objects
      for (let i = worldObjects.length - 1; i >= 0; i--) {
        const obj = worldObjects[i];
        obj.mesh.position.z += state.speed * 2;

        // Rotate obstacles/decorations for flair
        if (obj.mesh.children && obj.mesh.children[0]) {
          obj.mesh.children[0].rotation.y += 0.02;
        }

        // Collision detection
        if (obj.type === "obstacle") {
          if (obj.mesh.position.z > -0.8 && obj.mesh.position.z < 0.8) {
            const dx = Math.abs(player.position.x - obj.mesh.position.x);
            const dy = Math.abs(player.position.y - obj.mesh.position.y);
            if (dx < 0.8 && dy < 0.8) {
              gameOver();
              return;
            }
          }
        }

        // Cleanup
        if (obj.mesh.position.z > 10) {
          scene.remove(obj.mesh);
          worldObjects.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    // ─── TOUCH CONTROLS ─────────────────────────────────────────
    if ("ontouchstart" in window) {
      touchControls.classList.remove("hidden");
      touchControls.style.visibility = "hidden"; // shown on game start
      uiInstructions.classList.add("hidden");
    }

    document.getElementById("btn-left").addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (state.isPlaying && state.lane > -1) state.lane--;
    }, { passive: false });

    document.getElementById("btn-right").addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (state.isPlaying && state.lane < 1) state.lane++;
    }, { passive: false });

    document.getElementById("btn-jump").addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (state.isPlaying && !state.isJumping) {
        state.isJumping = true;
        state.jumpVel = CONFIG.jumpPower;
      }
    }, { passive: false });

    // ─── BOOT ───────────────────────────────────────────────────
    init();
  </script>
</body>

</html>
